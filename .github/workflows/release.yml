name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --release --locked
      - name: Package Windows
        shell: pwsh
        run: |
          $d = "dist/fastuse"
          New-Item -ItemType Directory -Force $d, "$d/skills/fastuse" | Out-Null
          Copy-Item target/release/fastuse.exe $d
          Copy-Item skills/fastuse/SKILL.md "$d/skills/fastuse/"
          Copy-Item README.md, LICENSE $d
          Compress-Archive -Path "$d/*" -DestinationPath dist/fastuse-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/fastuse-windows-x86_64.zip

  build-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: fastuse-macos-arm64.tar.gz
          - target: x86_64-apple-darwin
            asset: fastuse-macos-x86_64.tar.gz
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package macOS
        run: |
          mkdir -p dist/fastuse/skills/fastuse
          cp target/${{ matrix.target }}/release/fastuse dist/fastuse/
          cp skills/fastuse/SKILL.md dist/fastuse/skills/fastuse/
          cp README.md LICENSE dist/fastuse/
          tar -czf dist/${{ matrix.asset }} -C dist fastuse
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.ps1 install.sh artifacts/
          (cd artifacts && sha256sum fastuse-* > SHA256SUMS)
          gh release create "${{ github.ref_name }}" artifacts/* --title "${{ github.ref_name }}" --generate-notes
