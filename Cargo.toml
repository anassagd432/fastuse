[package]
name = "fastuse"
version = "0.1.0"
edition = "2021"
description = "Fast computer-use MCP server: UI tree + actions + screenshots, background-first (Windows today, macOS and Linux planned)"
license = "MIT"

[features]
default = ["runner"]
# `fastuse run "<task>"`: a small Gemini function-calling loop (needs your own GEMINI_API_KEY).
runner = ["dep:ureq"]

[dependencies]
serde_json = "1"
base64 = "0.22"
jpeg-encoder = "0.6"
ureq = { version = "2", features = ["json"], optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
